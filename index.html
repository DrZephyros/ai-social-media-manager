<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Insta-Manager — g0wtham.exe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00E5FF;
      --bg: #080c12;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #f0f4f8;
      --muted: rgba(255,255,255,0.45);
      --ig-pink: #E1306C;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ---- Animated Background ---- */
    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: #080c12;
      isolation: isolate;
    }
    .bg-animation::before,
    .bg-animation::after {
      content: '';
      position: absolute;
      inset: -35% -15% auto;
      height: 90vh;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }
    .bg-animation::before {
      background: radial-gradient(ellipse at 30% 35%, rgba(52,118,135,0.055), transparent 58%);
    }
    .bg-animation::after {
      inset: auto -15% -55%;
      background: radial-gradient(ellipse at 70% 55%, rgba(54,83,111,0.06), transparent 58%);
    }
    .parallax-shapes { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .parallax-shape { position: absolute; }
    .geometry-motion { display: block; width: 100%; height: 100%; animation: geometry-drift 22s ease-in-out infinite alternate; will-change: translate; }
    .parallax-shape:nth-child(2n) .geometry-motion { animation-duration: 27s; animation-direction: alternate-reverse; }
    .parallax-shape:nth-child(3n) .geometry-motion { animation-duration: 31s; }
    @keyframes geometry-drift {
      0% { translate: -26px -20px; }
      50% { translate: 28px 22px; }
      100% { translate: -18px 26px; }
    }
    .geometry-motion.parallax-ring { width: 100%; height: 100%; border: 1px solid rgba(0,229,255,0.48); border-radius: 50%; box-shadow: 0 0 12px rgba(0,229,255,0.16), inset 0 0 12px rgba(0,229,255,0.05); }
    .geometry-motion.ring-small { border-color: rgba(255,74,174,0.62); box-shadow: 0 0 12px rgba(255,74,174,0.2), inset 0 0 12px rgba(255,74,174,0.06); }
    .geometry-motion.parallax-dot { border-radius: 50%; background: rgba(0,229,255,0.72); box-shadow: 0 0 18px 5px rgba(0,229,255,0.3); }
    .parallax-shape:nth-child(5) .geometry-motion.parallax-dot { background: rgba(255,74,174,0.78); box-shadow: 0 0 18px 5px rgba(255,74,174,0.32); }
    .geometry-motion.parallax-cross { opacity: 0.3; }
    .geometry-motion.parallax-cross::before, .geometry-motion.parallax-cross::after { content: ''; position: absolute; background: rgba(255,74,174,0.88); box-shadow: 0 0 8px rgba(255,74,174,0.48); }
    .geometry-motion.parallax-cross::before { left: 0; right: 0; top: 18px; height: 2px; }
    .geometry-motion.parallax-cross::after { top: 0; bottom: 0; left: 18px; width: 2px; }
    .geometry-motion.parallax-glow { border-radius: 50%; filter: blur(95px); opacity: 0.12; background: #315d70; }
    @media (max-width: 600px) {
      .parallax-shape:nth-child(1), .parallax-shape:nth-child(3) { width: 180px !important; height: 180px !important; }
      .parallax-shape:nth-child(2) { width: 82px !important; height: 82px !important; }
    }
    .blob {
      position: absolute;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 34s infinite alternate ease-in-out;
    }
    .blob1 { width: 400px; height: 400px; background: rgba(49,113,130,0.13); top: -100px; left: -100px; }
    .blob2 { width: 500px; height: 500px; background: rgba(48,73,101,0.12); bottom: -150px; right: -100px; animation-duration: 42s; }
    .blob3 { width: 300px; height: 300px; background: rgba(57,89,105,0.08); top: 40%; left: 30%; animation-duration: 48s; }
    @keyframes float {
      0%   { transform: translate(0,0) scale(1); }
      33%  { transform: translate(16px,-20px) scale(1.04); }
      66%  { transform: translate(-12px,14px) scale(0.98); }
      100% { transform: translate(0,0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .geometry-motion { animation: none !important; }
      .geometry-motion { translate: 0 0; }
    }

    /* ---- Header ---- */
    header { text-align: center; margin-bottom: 3rem; }
    header h1 {
      font-size: 3rem; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header p { color: var(--muted); margin-top: 0.5rem; font-size: 1rem; }

    /* ---- Genre Picker ---- */
    #genre-picker {
      width: 100%;
      max-width: 560px;
      margin-bottom: 1.5rem;
    }
    #genre-picker h2 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    #genre-search-wrap {
      position: relative;
    }
    #genre-search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
      pointer-events: none;
    }
    #genre-search {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1rem 0.7rem 2.5rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #genre-search:focus { border-color: var(--cyan); }
    #genre-options {
      display: none;
      position: absolute;
      z-index: 30;
      top: calc(100% + 0.45rem);
      left: 0;
      right: 0;
      max-height: 280px;
      overflow-y: auto;
      padding: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #111923;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
      backdrop-filter: blur(18px);
    }
    #genre-options.open { display: block; }
    .genre-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.8rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .genre-option:hover, .genre-option[aria-selected="true"] { background: rgba(0,229,255,0.1); color: var(--cyan); }
    .genre-option.hidden { display: none; }
    #custom-genre-row {
      margin-top: 0.75rem;
      display: none;
      gap: 0.5rem;
    }
    #custom-genre-row.visible { display: flex; }
    #custom-genre-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
    }
    #custom-genre-input:focus { border-color: var(--cyan); }
    #genre-selected-label {
      font-size: 0.78rem;
      color: var(--cyan);
      font-weight: 600;
      margin-top: 0.5rem;
      min-height: 1.1rem;
    }

    /* ---- Control Panel ---- */
    #controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      width: 100%;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-brainstorm { background: linear-gradient(135deg, #00b4db, var(--cyan)); color: #000; }
    .btn-generate   { background: #ffffff; color: #000; }

    #controls.has-generated #btn-brainstorm,
    #controls.has-generated #btn-generate { display: none; }

    #post-generate-actions { display: none; flex-direction: column; gap: 0.75rem; }
    #post-generate-actions.visible { display: flex; }
    #post-generate-actions .action-row { width: 100%; }
    #post-generate-actions .action-btn { min-height: 50px; }
    .btn-regenerate { background: #fff; color: #000; }

    #topic-row { display: flex; flex-direction: column; gap: 0.75rem; }

    #topic-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      width: 100%;
    }

    /* ---- Status Bar ---- */
    #status {
      text-align: center;
      font-size: 0.95rem;
      color: var(--cyan);
      min-height: 1.4rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,229,255,0.3);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ================================================================
       OUTPUT SECTION — two-column layout
    ================================================================ */
    #output-section {
      display: none;
      width: 100%;
      max-width: 1100px;
      margin-top: 3rem;
      gap: 3rem;
      align-items: flex-start;
      /* flex row on wide screens */
      flex-direction: row;
      justify-content: center;
    }
    #output-section.visible { display: flex; }

    /* ---- LEFT: Instagram Phone Mockup ---- */
    .phone-wrapper {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .phone-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ====== PHONE SHELL — iPhone 15 Pro style ====== */
    .phone-shell {
      width: 290px;
      background: linear-gradient(160deg, #2a2a2a 0%, #1a1a1a 40%, #232323 100%);
      border-radius: 52px;
      padding: 12px;
      position: relative;
      box-shadow:
        0 0 0 1.5px #3a3a3a,
        0 0 0 3px #111,
        0 0 0 4px rgba(255,255,255,0.07),
        0 40px 100px rgba(0,0,0,0.9),
        0 10px 30px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }

    /* Volume buttons — LEFT side */
    .phone-shell::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 90px;
      width: 4px;
      height: 28px;
      background: linear-gradient(180deg, #2e2e2e, #1e1e1e);
      border-radius: 3px 0 0 3px;
      box-shadow: 0 36px 0 #2a2a2a, 0 72px 0 #2a2a2a;
    }

    /* Power button — RIGHT side */
    .phone-shell::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 110px;
      width: 4px;
      height: 60px;
      background: linear-gradient(180deg, #2e2e2e, #1e1e1e);
      border-radius: 0 3px 3px 0;
    }

    /* Screen area */
    .phone-screen {
      background: #000;
      border-radius: 42px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* Screen reflection highlight */
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Dynamic Island */
    .dynamic-island {
      position: relative;
      display: flex;
      justify-content: center;
      background: #000;
      padding-top: 10px;
    }
    .dynamic-island-pill {
      width: 110px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      border: 2px solid #1a1a1a;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 1px 2px rgba(0,0,0,0.8);
    }

    /* iOS status bar */
    .ios-statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 22px 0;
      background: #000;
    }
    .ios-time {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      font-family: -apple-system, 'Inter', sans-serif;
      letter-spacing: -0.3px;
    }
    .ios-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.55rem;
      color: #fff;
    }
    .ios-battery {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 0.6rem;
      font-weight: 600;
    }
    .ios-battery-bar {
      width: 22px; height: 11px;
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 1.5px;
    }
    .ios-battery-bar::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 2.5px;
      height: 5px;
      background: rgba(255,255,255,0.4);
      border-radius: 0 1px 1px 0;
    }
    .ios-battery-fill {
      width: 75%;
      height: 100%;
      background: #4cd964;
      border-radius: 1.5px;
    }

    /* Instagram-like top bar (below status bar) */
    .ig-topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem 0.5rem;
      background: #000;
      z-index: 2;
    }
    .ig-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
      padding: 2px;
    }
    .ig-avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #111;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
    }
    .ig-username { font-size: 0.8rem; font-weight: 700; color: #fff; flex: 1; }
    .ig-more { color: #fff; font-size: 1.2rem; line-height: 1; opacity: 0.6; }

    /* Carousel track inside phone */
    .ig-carousel-track-wrap {
      position: relative;
      overflow: hidden;
      /* Fixed width so aspect-ratio on children works */
      width: 100%;
      cursor: grab;
    }
    .ig-carousel-track-wrap:active { cursor: grabbing; }

    .ig-carousel-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Each slide inside the phone — photo background + text overlay */
    .ig-slide {
      flex-shrink: 0;
      width: 100%;
      aspect-ratio: 4 / 5;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-color: #0a0a12;
    }
    .ig-slide-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    /* Heavy gradient overlay for text readability */
    .ig-slide-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.3) 30%,
        rgba(0,0,0,0.75) 65%,
        rgba(0,0,0,0.92) 100%
      );
      z-index: 1;
    }
    /* Color tint per bg_type */
    .ig-slide[data-mood="red"] .ig-slide-bg::after {
      background: linear-gradient(to bottom, rgba(100,0,0,0.1) 0%, rgba(60,0,0,0.3) 30%, rgba(30,0,0,0.75) 65%, rgba(10,0,0,0.95) 100%);
    }
    .ig-slide[data-mood="purple"] .ig-slide-bg::after {
      background: linear-gradient(to bottom, rgba(40,0,80,0.1) 0%, rgba(30,0,60,0.3) 30%, rgba(15,0,40,0.75) 65%, rgba(5,0,15,0.95) 100%);
    }
    .ig-slide[data-mood="green"] .ig-slide-bg::after {
      background: linear-gradient(to bottom, rgba(0,60,20,0.1) 0%, rgba(0,40,10,0.3) 30%, rgba(0,20,5,0.75) 65%, rgba(0,5,2,0.95) 100%);
    }
    .ig-slide[data-mood="gold"] .ig-slide-bg::after {
      background: linear-gradient(to bottom, rgba(80,60,0,0.1) 0%, rgba(60,40,0,0.3) 30%, rgba(30,20,0,0.75) 65%, rgba(10,5,0,0.95) 100%);
    }

    .ig-slide-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.4rem 1.5rem;
    }

    .ig-slide-title {
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.18;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .ig-slide-title .highlight {
      color: var(--cyan);
    }
    .ig-slide-body {
      font-size: 0.72rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.88);
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .ig-slide-footer {
      flex-shrink: 0;
      padding: 0.3rem 1.2rem;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .ig-slide-footer span {
      font-size: 0.45rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      font-weight: 600;
    }
    .ig-slide-footer .handle { color: var(--cyan); opacity: 0.7; }

    /* Gradient backgrounds (fallback when no image) */
    .bg-gradient-blue   { background: linear-gradient(160deg, #0a0f1e 0%, #0d2137 50%, #0a3d6b 100%); }
    .bg-gradient-purple { background: linear-gradient(160deg, #0d0a1e 0%, #1a0d3d 50%, #2d0b6b 100%); }
    .bg-gradient-red    { background: linear-gradient(160deg, #1e0a0a 0%, #3d0d0d 50%, #6b1212 100%); }
    .bg-gradient-green  { background: linear-gradient(160deg, #0a1e0d 0%, #0d3d14 50%, #0b6b20 100%); }
    .bg-gradient-gold   { background: linear-gradient(160deg, #1e180a 0%, #3d300d 50%, #6b500b 100%); }

    /* Dot indicators */
    .ig-dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      padding: 0.5rem 0;
      background: #000;
    }
    .ig-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: background 0.3s, width 0.3s;
    }
    .ig-dot.active {
      background: var(--cyan);
      width: 14px;
      border-radius: 3px;
    }

    /* Instagram action row */
    .ig-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 1rem;
      background: #000;
    }
    .ig-action-icon {
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .ig-action-icon:hover { transform: scale(1.15); }
    .ig-action-icon.share { margin-left: auto; }

    /* Post info row below actions (likes + caption preview) */
    .ig-post-info {
      padding: 0 0.9rem 0.5rem;
      background: #000;
    }
    .ig-likes {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .ig-caption-preview {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ig-caption-preview strong {
      color: #fff;
      font-weight: 700;
    }
    .ig-view-comments {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.35);
      margin-top: 0.2rem;
    }
    .ig-home-indicator {
      height: 22px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ig-home-bar {
      width: 100px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }

    /* Navigation arrows on phone */
    .phone-nav {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }
    .phone-nav-btn {
      width: 42px; height: 42px;
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.72);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 12px rgba(0,229,255,0.2), inset 0 0 8px rgba(0,229,255,0.08);

    #nav-next { border-color: rgba(255,74,174,0.78); background: rgba(255,74,174,0.08); box-shadow: 0 0 12px rgba(255,74,174,0.22), inset 0 0 8px rgba(255,74,174,0.08); }
    .phone-nav-btn:hover { background: rgba(0,229,255,0.18); box-shadow: 0 0 18px rgba(0,229,255,0.38), inset 0 0 10px rgba(0,229,255,0.12); transform: translateY(-1px); }
    #nav-next:hover { background: rgba(255,74,174,0.18); box-shadow: 0 0 18px rgba(255,74,174,0.4), inset 0 0 10px rgba(255,74,174,0.12); }
    .phone-nav-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .slide-counter-text {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* ---- RIGHT: Caption & Actions Panel ---- */
    .caption-panel {
      flex: 1;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    /* Caption box */
    #caption-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.25rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.65;
      width: 100%;
      min-height: 220px;
      resize: vertical;
      backdrop-filter: blur(16px);

    #caption-box:focus {
      outline: none;
      border-color: rgba(0,229,255,0.3);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.06);
    }

    /* Action buttons row */
    .action-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 130px;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-copy {
      background: rgba(0,229,255,0.12);
      color: var(--cyan);
      border: 1px solid rgba(0,229,255,0.25);
    }
    .btn-copy:hover { background: rgba(0,229,255,0.2); }

    .btn-download {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
    }
    .btn-download:hover { background: rgba(255,255,255,0.14); }

    /* Copied feedback */
    .copied-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #4ade80;
      animation: fadeInOut 2s ease forwards;
    }
    .copied-badge.show { display: flex; }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateY(4px); }
      15%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Hashtag chips */
    .hashtag-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .hashtag-chip {
      background: rgba(0,229,255,0.07);
      border: 1px solid rgba(0,229,255,0.15);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--cyan);
      opacity: 0.8;
    }

    /* ---- Hidden off-screen render grid (for download) ---- */
    #render-grid {
      position: fixed;
      left: -9999px;
      top: 0;
      display: grid;
      grid-template-columns: repeat(5, 400px);
      gap: 0;
      pointer-events: none;
    }
    #render-grid .slide-card {
      width: 400px;
      height: 500px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #render-grid .slide-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2rem 1.5rem;
    }
    #render-grid .slide-accent {
      width: 48px; height: 4px;
      background: var(--cyan); border-radius: 2px; margin-bottom: 1rem;
    }
    #render-grid .slide-number {
      font-size: 0.85rem; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--cyan); opacity: 0.75;
    }
    #render-grid .slide-main {
      margin-top: auto; margin-bottom: auto;
      padding-top: 2rem; padding-bottom: 1rem;
    }
    #render-grid .slide-title {
      font-size: 2.6rem; font-weight: 900;
      line-height: 1.15; color: #fff;
      margin-bottom: 1.2rem; letter-spacing: -1px;
    }
    #render-grid .slide-body {
      font-size: 1.3rem; line-height: 1.6;
      color: rgba(255,255,255,0.85); font-weight: 500;
    }
    #render-grid .slide-footer {
      flex-shrink: 0;
      padding: 0.6rem 2rem;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0,229,255,0.12);

    #render-grid .slide-footer span {
      font-size: 0.65rem; letter-spacing: 1.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.35); font-weight: 600;
    }
    #render-grid .slide-footer .handle { color: var(--cyan); opacity: 0.7; }
    #render-grid .slide-card::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      opacity: 0.15; pointer-events: none;
    }
    #render-grid .slide-card::after {
      content: '';
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }

    /* responsive */
    @media (max-width: 780px) {
      #output-section { flex-direction: column; align-items: center; }
      .caption-panel { max-width: 320px; width: 100%; }
    }
  </style>
</head>

  <script>
    /* Live clock for status bar */
    function updateClock() {
      const el = document.getElementById('ios-clock');
      if (!el) return;
      const now = new Date();
      const h = now.getHours() % 12 || 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 30000);

    /* ============================================================
       DOM refs
    ============================================================ */
    const btnBrainstorm = document.getElementById('btn-brainstorm');
    const topicRow      = document.getElementById('topic-row');
    const topicInput    = document.getElementById('topic-input');
    const btnGenerate   = document.getElementById('btn-generate');
    const statusEl      = document.getElementById('status');
    const outputSection = document.getElementById('output-section');
    const igTrack       = document.getElementById('ig-track');
    const igDots        = document.getElementById('ig-dots');
    const navPrev       = document.getElementById('nav-prev');
    const navNext       = document.getElementById('nav-next');
    const slideCounter  = document.getElementById('slide-counter');
    const captionBox    = document.getElementById('caption-box');
    const hashtagChips  = document.getElementById('hashtag-chips');
    const controls      = document.getElementById('controls');
    const postGenerateActions = document.getElementById('post-generate-actions');
    const btnDownloadTop = document.getElementById('btn-download-top');
    const btnCopyTop = document.getElementById('btn-copy-top');
    const btnRegenerate = document.getElementById('btn-regenerate');
    const copiedBadge   = document.getElementById('copied-badge');
    const renderGrid    = document.getElementById('render-grid');

    const bgMap = {
      'gradient-blue':   'bg-gradient-blue',
      'gradient-purple': 'bg-gradient-purple',
      'gradient-red':    'bg-gradient-red',
      'gradient-green':  'bg-gradient-green',
      'gradient-gold':   'bg-gradient-gold',
    };

    let currentSlide = 0;
    let totalSlides  = 5;
    let currentScript = [];

    function setStatus(msg, spinner = false) {
      statusEl.innerHTML = spinner ? `<span class="spinner"></span>${msg}` : msg;
    }

    /* ============================================================
       Genre Picker
    ============================================================ */
    const GENRES = [
      { label: 'Economics', icon: '💰' },
      { label: 'Tech & AI', icon: '🤖' },
      { label: 'Mental Health', icon: '🧠' },
      { label: 'Physical Fitness', icon: '💪' },
      { label: 'Health & Nutrition', icon: '🥗' },
      { label: 'Bioengineering', icon: '🧬' },
      { label: 'Student Life', icon: '🎓' },
      { label: 'Entrepreneurship', icon: '🚀' },
      { label: 'Climate & Environment', icon: '🌍' },
      { label: 'Space & Astronomy', icon: '🔭' },
      { label: 'Neuroscience', icon: '🧪' },
      { label: 'Relationships', icon: '❤️' },
      { label: 'Personal Finance', icon: '📈' },
      { label: 'Future of Work', icon: '🏢' },
      { label: 'Psychology', icon: '💭' },
      { label: 'History & Hidden Facts', icon: '📜' },
      { label: 'Philosophy', icon: '🔮' },
      { label: 'Geopolitics', icon: '🌐' },
      { label: 'Parenting', icon: '👶' },
      { label: 'Food Science', icon: '🍕' },
      { label: 'Crypto & Web3', icon: '🔗' },
      { label: 'Other', icon: '✏️' },
    ];

    const genreOptions = document.getElementById('genre-options');
    const genreSearchWrap = document.getElementById('genre-search-wrap');
    const genreSearch = document.getElementById('genre-search');
    const customGenreRow = document.getElementById('custom-genre-row');
    const customGenreInput = document.getElementById('custom-genre-input');
    const genreSelectedLabel = document.getElementById('genre-selected-label');
    let selectedGenre = null;
    let isCustomGenre = false;

    GENRES.forEach(g => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'genre-option';
      option.setAttribute('role', 'option');
      option.dataset.label = g.label;
      option.setAttribute('aria-selected', 'false');
      option.textContent = `${g.icon}  ${g.label}`;
      option.addEventListener('click', () => {
        clearDraftTopic();
        if (g.label === 'Other') {
          isCustomGenre = true;
          selectedGenre = null;
          genreSearch.value = 'Other';
          customGenreRow.classList.add('visible');
          customGenreInput.focus();
        } else {
          isCustomGenre = false;
          customGenreRow.classList.remove('visible');
          selectedGenre = g.label;
          customGenreInput.value = '';
          genreSearch.value = `${g.icon} ${g.label}`;
        }
        genreOptions.querySelectorAll('.genre-option').forEach(item => item.setAttribute('aria-selected', String(item === option)));
        closeGenreOptions();
        updateGenreLabel();
        updateActionAvailability();
      });
      genreOptions.appendChild(option);
    });

    customGenreInput.addEventListener('input', () => {
      clearDraftTopic();
      selectedGenre = null;
      updateGenreLabel();
      updateActionAvailability();
    });

    genreSearch.addEventListener('input', () => {
      openGenreOptions();
      const q = genreSearch.value.replace(/^\p{Extended_Pictographic}\s*/u, '').trim().toLowerCase();
      genreOptions.querySelectorAll('.genre-option').forEach(option => {
        option.classList.toggle('hidden', !option.dataset.label.toLowerCase().includes(q));
      });
    });

    genreSearch.addEventListener('focus', () => {
      if (selectedGenre || isCustomGenre) genreSearch.select();
      openGenreOptions();
    });
    genreSearch.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeGenreOptions();
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        genreOptions.querySelector('.genre-option:not(.hidden)')?.focus();
      }
    });
    document.addEventListener('click', event => {
      if (!genreSearchWrap.contains(event.target)) closeGenreOptions();
    });

    function openGenreOptions() {
      genreOptions.classList.add('open');
      genreSearch.setAttribute('aria-expanded', 'true');
    }

    function closeGenreOptions() {
      genreOptions.classList.remove('open');
      genreSearch.setAttribute('aria-expanded', 'false');
      genreOptions.querySelectorAll('.genre-option').forEach(option => option.classList.remove('hidden'));
    }

    function updateGenreLabel() {
      genreSelectedLabel.textContent = isCustomGenre
        ? (customGenreInput.value.trim() ? `✅ Niche: ${customGenreInput.value.trim()}` : 'Enter your custom niche to continue.')
        : selectedGenre ? `✅ Niche: ${selectedGenre}` : '';
    }

    function clearDraftTopic() {
      outputSection.classList.remove('visible');
      controls.classList.remove('has-generated');
      postGenerateActions.classList.remove('visible');
      setStatus('');
    }

    function getGenre() {
      if (isCustomGenre) return customGenreInput.value.trim() || null;
      return selectedGenre;
    }

    function updateActionAvailability() {
      const genre = getGenre();
      btnBrainstorm.disabled = !genre;
      btnGenerate.disabled = !genre || !topicInput.value.trim();
    }

    topicInput.addEventListener('input', () => {
      if (outputSection.classList.contains('visible')) clearDraftTopic();
      updateActionAvailability();
    });
    updateActionAvailability();

    /* ============================================================
       Step 1: Brainstorm
    ============================================================ */
    btnBrainstorm.addEventListener('click', async () => {
      btnBrainstorm.disabled = true;
      const genre = getGenre();
      if (!genre) {
        setStatus('Choose a niche before brainstorming a topic.');
        updateActionAvailability();
        return;
      }
      setStatus(`Brainstorming a viral ${genre} topic...`, true);
      try {
        const res  = await fetch('/api/brainstorm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ genre })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
        if (data.genre !== genre) {
          throw new Error(`Genre mismatch: you selected "${genre}" but the server used "${data.genre || 'none'}". No topic was accepted.`);
        }
        if (data.topic) {
          topicInput.value = data.topic;
          updateActionAvailability();
          setStatus(`✅ Topic ready for ${data.genre} — edit it or approve as-is.`);
        } else {
          throw new Error('The server returned no topic. Please try again.');
        }
      } catch (err) {
        setStatus(`❌ ${err.message || 'Failed to connect to server.'}`);
      }
      updateActionAvailability();
    });

    /* ============================================================
       Step 2: Generate via SSE
    ============================================================ */
    btnGenerate.addEventListener('click', () => {
      const topic = topicInput.value.trim();
      const genre = getGenre();
      if (!genre || !topic) {
        setStatus(!genre ? 'Choose a niche before generating the carousel.' : 'Enter a topic before generating the carousel.');
        updateActionAvailability();
        return;
      }

      btnGenerate.disabled = true;
      outputSection.classList.remove('visible');
      igTrack.innerHTML = '';
      igDots.innerHTML  = '';
      hashtagChips.innerHTML = '';
      captionBox.value  = '';
      setStatus('Connecting to Gemini...', true);

      const evtSource = new EventSource(`/api/generate-stream?topic=${encodeURIComponent(topic)}&genre=${encodeURIComponent(genre || '')}`);

      evtSource.onmessage = async (e) => {
        const payload = JSON.parse(e.data);

        if (payload.error) {
          setStatus('❌ Error: ' + payload.error);
          evtSource.close();
          btnGenerate.disabled = false;
          return;
        }

        if (payload.status) setStatus(payload.status, true);

        if (payload.done && payload.script) {
          evtSource.close();
          currentScript = payload.script;
          
          setStatus('📸 Fetching high-quality backgrounds...', true);
          
          // Fetch images for each slide in parallel
          await Promise.all(currentScript.map(async (slide) => {
            if (!slide.image_query) return;
            try {
              const res = await fetch(`/api/images?q=${encodeURIComponent(slide.image_query)}`);
              const data = await res.json();
              if (data.images && data.images.length > 0) {
                slide.bg_image = data.images[0];
              }
            } catch (e) { console.error('Image fetch error', e); }
          }));

          renderPhonePreview(currentScript);
          buildRenderGrid(currentScript);

          if (payload.caption) {
            captionBox.value = payload.caption;
            // Auto-copy caption to clipboard
            navigator.clipboard.writeText(payload.caption).catch(() => {});
            showCopied();
            // Show hashtag chips
            const tags = payload.caption.match(/#\w+/g) || [];
            hashtagChips.innerHTML = tags.map(t => `<span class="hashtag-chip">${t}</span>`).join('');
            // Update phone caption preview (first non-hashtag line)
            const previewEl = document.getElementById('ig-caption-preview');
            if (previewEl) {
              const firstLine = payload.caption.split('\n').find(l => l.trim() && !l.trim().startsWith('#')) || '';
              previewEl.innerHTML = `<strong>g0wtham.exe</strong> ${firstLine}`;
            }
          }

          outputSection.classList.add('visible');
          controls.classList.add('has-generated');
          postGenerateActions.classList.add('visible');
          setStatus('✅ Carousel ready! Scroll the preview → then download or copy caption.');
          btnGenerate.disabled = false;
        }
      };

      evtSource.onerror = () => {
        setStatus('❌ Connection error. Try again.');
        evtSource.close();
        btnGenerate.disabled = false;
      };
    });

    /* ============================================================
       Render Instagram phone preview
    ============================================================ */
    function formatTitle(title) {
      // Highlight the last word or specific words for visual pop
      const words = title.split(' ');
      if (words.length > 1) {
        const lastWord = words.pop();
        return `${words.join(' ')} <span class="highlight">${lastWord}</span>`;
      }
      return title;
    }

    function renderPhonePreview(slides) {
      igTrack.innerHTML = '';
      igDots.innerHTML  = '';
      totalSlides = slides.length;
      currentSlide = 0;

      slides.forEach((slide, i) => {
        const mood = slide.bg_type ? slide.bg_type.replace('gradient-', '') : 'blue';
        const bgClass = bgMap[slide.bg_type] || 'bg-gradient-blue';
        const bgStyle = slide.bg_image ? `background-image: url('${slide.bg_image}')` : '';
        // Slide
        const el = document.createElement('div');
        el.className = `ig-slide ${!slide.bg_image ? bgClass : ''}`;
        el.dataset.mood = mood;
        el.innerHTML = `
          <div class="ig-slide-bg" style="${bgStyle}"></div>
          <div class="ig-slide-content">
            <div class="ig-slide-main">
              <div class="ig-slide-title">${formatTitle(slide.title)}</div>
              <div class="ig-slide-body">${slide.body_text}</div>
            </div>
          </div>
          <div class="ig-slide-footer">
            <span>Slide ${slide.slide_number} / ${totalSlides}</span>
            <span class="handle">@g0wtham.exe</span>
          </div>
        `;
        igTrack.appendChild(el);

        // Dot
        const dot = document.createElement('div');
        dot.className = 'ig-dot' + (i === 0 ? ' active' : '');
        igDots.appendChild(dot);
      });

      updateCarousel();
      setupSwipe();
    }

    /* ============================================================
       Carousel navigation
    ============================================================ */
    function updateCarousel() {
      igTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
      document.querySelectorAll('.ig-dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentSlide);
      });
      slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
    }

    navPrev.addEventListener('click', () => {
      if (currentSlide > 0) { currentSlide--; updateCarousel(); }
    });
    navNext.addEventListener('click', () => {
      if (currentSlide < totalSlides - 1) { currentSlide++; updateCarousel(); }
    });

    // Touch/mouse swipe inside phone
    function setupSwipe() {
      const wrap = document.getElementById('ig-track-wrap');
      let startX = 0;

      wrap.addEventListener('mousedown', e => { startX = e.clientX; });
      wrap.addEventListener('mouseup', e => {
        const diff = startX - e.clientX;
        if (diff > 30 && currentSlide < totalSlides - 1) { currentSlide++; updateCarousel(); }
        if (diff < -30 && currentSlide > 0)               { currentSlide--; updateCarousel(); }
      });

      wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      wrap.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (diff > 30 && currentSlide < totalSlides - 1) { currentSlide++; updateCarousel(); }
        if (diff < -30 && currentSlide > 0)               { currentSlide--; updateCarousel(); }
      });
    }

    /* ============================================================
       Build hidden render grid (full resolution for download)
    ============================================================ */
    function buildRenderGrid(slides) {
      renderGrid.innerHTML = '';
      const numSlides = slides.length;
      
      // Update CSS for the off-screen grid to match the new style
      if (!document.getElementById('render-grid-style')) {
        const style = document.createElement('style');
        style.id = 'render-grid-style';
        style.innerHTML = `
          #render-grid .slide-card { width: 400px; height: 500px; min-height: 500px; background-color: #0a0a12; }
          #render-grid .slide-card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
          #render-grid .slide-card-bg::after {
            content: ''; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.3) 30%, rgba(0,0,0,0.75) 65%, rgba(0,0,0,0.92) 100%);
          }
          #render-grid .slide-card[data-mood="red"] .slide-card-bg::after { background: linear-gradient(to bottom, rgba(100,0,0,0.1) 0%, rgba(60,0,0,0.3) 30%, rgba(30,0,0,0.75) 65%, rgba(10,0,0,0.95) 100%); }
          #render-grid .slide-card[data-mood="purple"] .slide-card-bg::after { background: linear-gradient(to bottom, rgba(40,0,80,0.1) 0%, rgba(30,0,60,0.3) 30%, rgba(15,0,40,0.75) 65%, rgba(5,0,15,0.95) 100%); }
          #render-grid .slide-card[data-mood="green"] .slide-card-bg::after { background: linear-gradient(to bottom, rgba(0,60,20,0.1) 0%, rgba(0,40,10,0.3) 30%, rgba(0,20,5,0.75) 65%, rgba(0,5,2,0.95) 100%); }
          #render-grid .slide-card[data-mood="gold"] .slide-card-bg::after { background: linear-gradient(to bottom, rgba(80,60,0,0.1) 0%, rgba(60,40,0,0.3) 30%, rgba(30,20,0,0.75) 65%, rgba(10,5,0,0.95) 100%); }
          #render-grid .slide-content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 1.5rem 2.35rem; min-height: 0; overflow: hidden; }
          #render-grid .slide-main { width: 100%; min-width: 0; }
          #render-grid .slide-title { font-size: 2.6rem; font-weight: 900; line-height: 1.12; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1.05rem; text-shadow: 0 2px 8px rgba(0,0,0,0.6); overflow-wrap: anywhere; }
          #render-grid .slide-title .highlight { color: var(--cyan); }
          #render-grid .slide-body { font-size: 1.35rem; line-height: 1.45; color: rgba(255,255,255,0.88); font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.5); overflow-wrap: anywhere; }
          #render-grid .slide-footer { flex-shrink: 0; padding: 0.8rem 2.5rem; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
          #render-grid .slide-footer span { font-size: 0.9rem; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); font-weight: 600; }
          #render-grid .slide-footer .handle { color: var(--cyan); opacity: 0.7; }
        `;
        document.head.appendChild(style);
      }

      slides.forEach((slide, i) => {
        const mood = slide.bg_type ? slide.bg_type.replace('gradient-', '') : 'blue';
        const bgClass = bgMap[slide.bg_type] || 'bg-gradient-blue';
        const bgStyle = slide.bg_image ? `background-image: url('${slide.bg_image}')` : '';
        const card = document.createElement('div');
        card.className = `slide-card ${!slide.bg_image ? bgClass : ''}`;
        card.dataset.mood = mood;
        card.id = `render-slide-${i + 1}`;
        card.innerHTML = `
          <div class="slide-card-bg" style="${bgStyle}"></div>
          <div class="slide-content">
            <div class="slide-main">
              <div class="slide-title">${formatTitle(slide.title)}</div>
              <div class="slide-body">${slide.body_text}</div>
            </div>
          </div>
          <div class="slide-footer">
            <span>Slide ${slide.slide_number} / ${numSlides}</span>
            <span class="handle">@g0wtham.exe</span>
          </div>
        `;
        renderGrid.appendChild(card);
      });

      fitRenderText();
    }

    function fitRenderText() {
      renderGrid.querySelectorAll('.slide-card').forEach(card => {
        const title = card.querySelector('.slide-title');
        const body = card.querySelector('.slide-body');
        const main = card.querySelector('.slide-main');
        const content = card.querySelector('.slide-content');
        if (!title || !body || !main || !content) return;
        main.style.transform = '';
        main.style.transformOrigin = 'center center';
        let fontSize = 42;
        title.style.fontSize = `${fontSize}px`;
        while (fontSize > 24 && (title.scrollHeight > content.clientHeight * 0.42 || title.scrollWidth > title.clientWidth + 1)) {
          fontSize -= 1;
          title.style.fontSize = `${fontSize}px`;
        }
        let bodySize = 21.6;
        body.style.fontSize = `${bodySize}px`;
        const fits = () => main.scrollHeight <= content.clientHeight + 1
          && title.scrollWidth <= title.clientWidth + 1;
        while (bodySize > 14 && !fits()) {
          bodySize -= 0.5;
          body.style.fontSize = `${bodySize}px`;
        }
        while (fontSize > 20 && !fits()) {
          fontSize -= 1;
          title.style.fontSize = `${fontSize}px`;
        }
        if (!fits()) {
          const scale = Math.min(1, content.clientWidth / main.scrollWidth, content.clientHeight / main.scrollHeight);
          main.style.transform = `scale(${Math.max(0.5, scale)})`;
        }
      });
    }

    /* ============================================================
       Copy Caption
    ============================================================ */
    btnCopyTop.addEventListener('click', () => {
      navigator.clipboard.writeText(captionBox.value)
        .then(showCopied)
        .catch(() => {
          captionBox.select();
          document.execCommand('copy');
          showCopied();
        });
    });

    btnRegenerate.addEventListener('click', () => {
      controls.classList.remove('has-generated');
      postGenerateActions.classList.remove('visible');
      btnGenerate.click();
    });

    function showCopied() {
      copiedBadge.classList.remove('show');
      void copiedBadge.offsetWidth; // reflow to restart animation
      copiedBadge.classList.add('show');
      setTimeout(() => copiedBadge.classList.remove('show'), 2200);
    }

    /* ============================================================
       Download Slides as individual JPEGs in a ZIP
    ============================================================ */
    async function downloadSlides(button) {
      button.disabled = true;
      button.textContent = '⏳ Preparing...';

      try {
        // Load dependencies
        const [h2cMod, JSZip] = await Promise.all([
          import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js'),
          loadJSZip()
        ]);
        const html2canvas = h2cMod.default;
        const zip = new JSZip();

        buildRenderGrid(currentScript);
        await document.fonts.ready;
        fitRenderText();

        for (let i = 1; i <= currentScript.length; i++) {
          const el = document.getElementById(`render-slide-${i}`);
          if (!el) continue;
          const canvas = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: null });
          if (!canvas.width || !canvas.height) throw new Error(`Could not render slide ${i}.`);
          const blob = await new Promise((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error(`Could not encode slide ${i}.`)), 'image/jpeg', 0.95));
          zip.file(`slide_${i}.jpg`, blob);
        }

        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        
        // Generate filename: YYYY-MM-DD_slide-1-title.zip
        const dateStr = new Date().toISOString().split('T')[0];
        let titleStr = "carousel";
        if (currentScript && currentScript.length > 0 && currentScript[0].title) {
          titleStr = currentScript[0].title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        }
        a.download = `${dateStr}_${titleStr}.zip`;
        
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      } catch (err) {
        alert('Download failed: ' + err.message);
      }

      button.disabled = false;
      button.innerHTML = '⬇️ Download Slides';
    }

    btnDownloadTop.addEventListener('click', () => downloadSlides(btnDownloadTop));

    function loadJSZip() {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
        s.onload = () => resolve(window.JSZip);
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

  </script>
</body>
